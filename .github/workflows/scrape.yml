name: Daily PokerAtlas scrape

on:
  schedule:
    # 10:00 UTC = 6:00am Eastern (5:00am during EST) - once a day, off-peak.
    - cron: "0 10 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" in GitHub to run it on demand

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scraper.py

      - name: Commit updated data (if changed)
        run: |
          git config user.name "poker-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/tournaments.json
          if git diff --cached --quiet; then
            echo "No changes to tournament data today."
          else
            git commit -m "Daily tournament data update"
            git push
          fi
